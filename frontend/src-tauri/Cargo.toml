[package]
name = "llm-server-dib"
version = "0.1.0"
description = "Desktop security audit tool for ГОСТ Р 56939-2024"
authors = [ "llm-server-dib" ]
edition = "2021"

[build-dependencies]
tauri = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
tokio = { version = "1", features = [ "full" ] }
